<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Meteorológica UPA</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        h1 { color: #38bdf8; text-transform: uppercase; font-size: 1.8rem; margin-bottom: 20px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .card { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 12px; }
        .card h3 { margin: 0; color: #94a3b8; font-size: 1em; text-transform: uppercase; }
        .card .value { font-size: 3.5em; font-family: 'Courier New', monospace; font-weight: bold; margin: 10px 0; }
        .val-temp { color: #f87171; }
        .val-hum { color: #60a5fa; }
        .val-wind { color: #4ade80; }
        .unit { font-size: 0.3em; color: #94a3b8; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 0.9em; margin-top: 10px; }
        th { background: #334155; color: #94a3b8; padding: 10px; }
        td { background: #1e293b; padding: 10px; border-top: 1px solid #334155; }
        .table-section { background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: left; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; }
        .btn-reset { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌤️ Estación Meteorológica UPA</h1>
        
        <!-- Indicadores en tiempo real -->
        <div class="grid-cards">
            <div class="card">
                <h3>Temperatura</h3>
                <div class="value val-temp" id="val-temp">-- <span class="unit">°C</span></div>
            </div>
            <div class="card">
                <h3>Humedad</h3>
                <div class="value val-hum" id="val-hum">-- <span class="unit">%</span></div>
            </div>
            <div class="card">
                <h3>Viento</h3>
                <div class="value val-wind" id="val-wind">-- <span class="unit">m/s</span></div>
            </div>
        </div>

        <!-- Historial por minuto -->
        <div class="table-section">
            <div class="header-section">
                <h2 style="color:#38bdf8; font-size: 1.2em; margin: 0;">🕒 Historial (Registrado cada minuto)</h2>
                <button class="btn-reset" onclick="borrarHistorial()">Limpiar Historial</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Temperatura (°C)</th>
                        <th>Humedad (%)</th>
                        <th>Viento (m/s)</th>
                    </tr>
                </thead>
                <tbody id="history-table"></tbody>
            </table>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDF00ZBgFz0yu-uogdLgP7G4Xp94cgNg-g",
            databaseURL: "https://cronometro-pista-618ad-default-rtdb.firebaseio.com",
            projectId: "cronometro-pista-618ad"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Escuchar los datos en tiempo real
        db.ref('estacion/actual').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('val-temp').innerHTML = (data.temp !== undefined ? data.temp.toFixed(1) : '--') + ' <span class="unit">°C</span>';
                document.getElementById('val-hum').innerHTML = (data.hum !== undefined ? data.hum.toFixed(1) : '--') + ' <span class="unit">%</span>';
                document.getElementById('val-wind').innerHTML = (data.viento !== undefined ? data.viento.toFixed(1) : '--') + ' <span class="unit">m/s</span>';
            }
        });

        // 2. Escuchar el historial para alimentar la tabla
        db.ref('estacion/historial').on('value', (snapshot) => {
            const data = snapshot.val();
            const historyBody = document.getElementById('history-table');
            historyBody.innerHTML = "";
            
            if (data) {
                const lista = Object.values(data);
                // Invertimos la lista para que el más nuevo salga hasta arriba
                lista.slice().reverse().forEach(item => {
                    historyBody.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td>${item.time}</td>
                            <td>${item.temp.toFixed(1)}</td>
                            <td>${item.hum.toFixed(1)}</td>
                            <td>${item.viento.toFixed(1)}</td>
                        </tr>
                    `);
                });
            } else {
                historyBody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Aún no hay registros en la base de datos. ESP32 subirá un registro en menos de 1 minuto.</td></tr>";
            }
        });

        // 3. Función para limpiar el historial (Administrador o Usuario)
        function borrarHistorial() {
            if (confirm("¡ATENCIÓN! Se borrará todo el historial meteorológico en la nube. ¿Estás de acuerdo?")) {
                db.ref('estacion/historial').remove();
            }
        }
    </script>
</body>
</html>
